<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3000" viewBox="0 0 3000 3000">
  <!-- CONTRABEATZ Cover-Vorlage · 3000 x 3000 px
       Rand 6 % = 180 px. Mono-Zeilen oben/unten, Form mittig (46 % = 1380 px), Titel unten links.
       Ebene "Hilfslinien" vor dem Export ausblenden. -->
  <rect width="3000" height="3000" fill="#0B0B0B"/>
  <g id="Hilfslinien" fill="none" stroke="#FF3D00" stroke-width="2" opacity=".6">
    <rect x="180" y="180" width="2640" height="2640"/>
    <rect x="810" y="760" width="1380" height="1380"/>
    <line x1="1500" y1="0" x2="1500" y2="3000"/>
  </g>
  <g fill="#F4F4F2" font-family="IBM Plex Mono, monospace" font-size="102" letter-spacing="3">
    <text x="180" y="280">CB—001</text>
    <text x="2820" y="280" text-anchor="end">DRUM KIT</text>
    <text x="180" y="2820">CONTRABEATZ</text>
    <text x="2820" y="2820" text-anchor="end">120 SAMPLES</text>
  </g>
  <g id="Form" fill="#F4F4F2" transform="translate(810 760) scale(13.8)">
    <rect x="0" y="0" width="22" height="22"/><rect x="26" y="0" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="52" y="0" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="78" y="0" width="22" height="22"/>
    <rect x="0" y="26" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="26" y="26" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="52" y="26" width="22" height="22"/><rect x="78" y="26" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/>
    <rect x="0" y="52" width="22" height="22"/><rect x="26" y="52" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="52" y="52" width="22" height="22"/><rect x="78" y="52" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/>
    <rect x="0" y="78" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="26" y="78" width="22" height="22"/><rect x="52" y="78" width="22" height="22" fill="none" stroke="#F4F4F2" stroke-width="1.5"/><rect x="78" y="78" width="22" height="22"/>
  </g>
  <text x="180" y="2620" fill="#F4F4F2" font-family="Inter, Helvetica, sans-serif" font-weight="500" font-size="258" letter-spacing="-9">Friedrichshain Drums</text>
