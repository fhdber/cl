name: Build & Validate

on:
  push:
    paths: [ "Source/**", "Tools/**", "Resources/**", "CMakeLists.txt", ".github/workflows/build.yml" ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Universal Binary)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Check architectures
        run: lipo -archs "build/CONTRA86_artefacts/Release/AU/CONTRA-86.component/Contents/MacOS/CONTRA-86"

      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -a | grep Cntb
          auval -strict -v aumu Cb86 Cntb

      - name: pluginval (Level 5)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            "build/CONTRA86_artefacts/Release/VST3/CONTRA-86.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/CONTRA86_artefacts/Release/VST3/CONTRA-86.vst3 dist/
          cp -R build/CONTRA86_artefacts/Release/AU/CONTRA-86.component dist/

      - uses: actions/upload-artifact@v4
        with:
          name: CONTRA-86-macOS-unsigned
          path: dist

  linux-render-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Build render test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCONTRA86_TOOLS=ON
          cmake --build build --target CONTRA86_Render

      - name: Render & check presets
        run: ./build/CONTRA86_Render_artefacts/Release/CONTRA86_Render renders

      - name: UI screenshot
        run: xvfb-run -a ./build/CONTRA86_Render_artefacts/Release/CONTRA86_Render --ui renders/ui.png 1

      - uses: actions/upload-artifact@v4
        with:
          name: CONTRA-86-preset-renders
          path: renders
